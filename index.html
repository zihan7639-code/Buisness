<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Business Marketplace</title>

  <style>
    /* Complete self-contained styling (Zero external network dependencies) */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    html, body {
      background-color: #f8f9fa;
      color: #111827;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    input, button, select, textarea { font-family: inherit; font-size: inherit; }
    
    /* Notification Badges */
    .badge-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #ef4444;
      border-radius: 50%;
      border: 2px solid #ffffff;
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.8);
      animation: pulse-dot 1.4s infinite;
      vertical-align: middle;
    }
    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: #ef4444;
      color: #ffffff;
      font-size: 10px;
      font-weight: 800;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 9999px;
      border: 1.5px solid #ffffff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      vertical-align: middle;
    }
    .badge-pill-dot {
      width: 5px;
      height: 5px;
      background: #ffffff;
      border-radius: 50%;
      display: inline-block;
    }
    .badge-pill-num {
      font-family: monospace, sans-serif;
      font-weight: bold;
    }
    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.18); opacity: 0.85; }
    }

    /* Core Utility Layouts */
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-center { justify-content: center; }
    .justify-between { justify-content: space-between; }
    .flex-1 { flex: 1 1 0%; }
    .relative { position: relative; }
    .absolute { position: absolute; }
    .fixed { position: fixed; }
    .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
    .z-10 { z-index: 10; }
    .z-40 { z-index: 40; }
    .z-50 { z-index: 50; }
    .z-60 { z-index: 60; }
    .hidden { display: none !important; }
    .w-full { width: 100%; }
    .h-full { height: 100%; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* TopBar & Buttons */
    header {
      position: sticky; top: 0; z-index: 40;
      background: #ffffff; border-bottom: 1px solid #e5e7eb;
      padding: 10px 16px; display: flex; align-items: center; justify-content: space-between;
    }
    .icon-btn {
      background: transparent; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: 50%; color: #374151;
      padding: 0; position: relative;
    }
    .icon-btn:hover { background: #f3f4f6; }
    
    /* Drawers */
    .drawer-overlay {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(0, 0, 0, 0.45); display: flex;
    }
    .drawer-content-left {
      width: 82%; max-width: 320px; height: 100%; background: #ffffff;
      box-shadow: 2px 0 12px rgba(0,0,0,0.15); display: flex; flex-direction: column; padding: 16px;
    }
    .drawer-content-right {
      width: 82%; max-width: 320px; height: 100%; background: #ffffff;
      box-shadow: -2px 0 12px rgba(0,0,0,0.15); display: flex; flex-direction: column; padding: 20px;
    }

    /* Cards & Grids */
    .prod-grid {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;
    }
    @media (min-width: 640px) {
      .prod-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    .card {
      background: #ffffff; border: 1px solid #e5e7eb; border-radius: 12px;
      padding: 10px; cursor: pointer; display: flex; flex-direction: column;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .card:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.06); }
  </style>
</head>

    function getStorage(key, fallback) {
      try {
        if (typeof window !== "undefined" && window.localStorage) {
          var data = localStorage.getItem(key);
          if (data !== null && data !== undefined) {
            var parsed = JSON.parse(data);
            return parsed !== null && parsed !== undefined ? parsed : fallback;
          }
        }
      } catch (err) {}
      return MemoryFallback[key] !== undefined ? MemoryFallback[key] : fallback;
    }

    function setStorage(key, val) {
      try {
        if (typeof window !== "undefined" && window.localStorage) {
          localStorage.setItem(key, JSON.stringify(val));
        }
      } catch (err) {}
      MemoryFallback[key] = val;
