<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Business Marketplace</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      margin: 0;
      background-color: #f8f9fa;
      color: #111827;
      overflow-x: hidden;
    }
    .font-cyber { font-family: 'Orbitron', sans-serif; }
    .font-cyber-mono { font-family: 'Share Tech Mono', monospace; }
  </style>
</head>
<body class="bg-[#f8f9fa] text-gray-900 min-h-screen">
  <div id="app"></div>

  <script>
    // --- STORAGE & STATE CONFIG ---
    const SUB_URL = "https://www.youtube.com/@Ultra-Gaming-2.O-Official";
    const K_SUB = "app_ultra_unlocked";
    const K_USER = "app_auth_user";
    const K_USERS = "app_users_list";
    const K_PRODUCTS = "app_products_list";
    const K_MESSAGES = "app_messages_list";

    // Clean initial store: ALL non-human / fake demo products are completely DELETED
    const DEFAULT_USERS = [
      { uid: "u_alex", username: "Alex", password: "password", photoURL: "https://api.dicebear.com/7.x/avataaars/svg?seed=Alex", blockedUsers: [] },
      { uid: "u_maya", username: "Maya", password: "password", photoURL: "https://api.dicebear.com/7.x/avataaars/svg?seed=Maya", blockedUsers: [] }
    ];

    function load(key, fallback) {
      try {
        const d = localStorage.getItem(key);
        return d ? JSON.parse(d) : fallback;
      } catch (e) {
        return fallback;
      }
    }
    function save(key, val) {
      try {
        localStorage.setItem(key, JSON.stringify(val));
      } catch (e) {}
    }

    // State Variables
    let subUnlocked = load(K_SUB, false);
    let users = load(K_USERS, DEFAULT_USERS);
    let currentUser = load(K_USER, null);
    let products = load(K_PRODUCTS, []); // 100% human-created only
    let messages = load(K_MESSAGES, []);

    let view = "dashboard"; // 'dashboard' | 'detail' | 'chat'
    let selectedProduct = null;
    let chatPeer = null;
    let authMode = "signin"; // 'signin' | 'register'

    // Drawers & Modals
    let friendsDrawerOpen = false;
    let profileDrawerOpen = false;
    let createModalOpen = false;
    let searchModalOpen = false;
    let chatMenuOpen = false;
    let stagedMedia = [];
    let isEditingProfile = false;

    // SVG Icons
    const Icons = {
      menu: `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>`,
      search: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" stroke-width="2"/><path d="m21 21-4.3-4.3" stroke-width="2"/></svg>`,
      plus: `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="M12 5v14M5 12h14"/></svg>`,
      plusSquare: `<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2" stroke-width="2"/><path stroke-linecap="round" stroke-width="2" d="M12 8v8M8 12h8"/></svg>`,
      close: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="M18 6 6 18M6 6l12 12"/></svg>`,
      back: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="m12 19-7-7 7-7M19 12H5"/></svg>`,
      dots: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="19" r="1.5" fill="currentColor"/></svg>`,
      send: `<svg class="w-4 h-4 ml-0.5" viewBox="0 0 24 24" fill="currentColor"><path d="M3.478 2.405a.75.75 0 0 0-.926.94l2.432 7.905H13.5a.75.75 0 0 1 0 1.5H4.984l-2.432 7.905a.75.75 0 0 0 .926.94 60.519 60.519 0 0 0 18.445-8.986.75.75 0 0 0 0-1.218A60.517 60.517 0 0 0 3.478 2.405Z"/></svg>`,
      pencil: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>`,
      trash: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>`,
      reset: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path stroke-width="2" d="M3 3v5h5"/></svg>`,
      logout: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>`,
      chat: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>`,
      chevronRight: `<svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="m9 18 6-6-6-6"/></svg>`,
      chevronDown: `<svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="m6 9 6 6 6-6"/></svg>`
    };

    // --- RENDER ENGINE ---
    function render() {
      const app = document.getElementById("app");
      if (!app) return;

      // 1. Subscription Gate
      if (!subUnlocked) {
        app.innerHTML = `
          <div class="fixed inset-0 z-50 flex items-center justify-center bg-black p-4 select-none">
            <div class="relative z-10 w-full max-w-[420px] bg-black/90 border border-green-500 rounded-xl p-8 font-cyber-mono text-green-400 shadow-[0_0_30px_rgba(0,255,65,0.2)] text-center">
              <span class="text-4xl block mb-2 text-red-500 animate-bounce">⚠</span>
              <h1 class="font-cyber text-xl font-black text-red-500">SUB TO ULTRA</h1>
              <p class="text-xs text-red-400 mt-1">Subscription Required for Access</p>
              <button onclick="handleGoToUltra()" class="w-full py-3.5 px-4 mt-6 border border-red-500 bg-red-500/10 hover:bg-red-500/25 text-red-400 font-cyber font-bold text-sm tracking-widest rounded-lg transition cursor-pointer">
                [ SIGN IN TO ULTRA ]
              </button>
              <p class="mt-3 text-[11px] text-zinc-500">Opens Ultra-Gaming-2.O-Official on YouTube to unlock access</p>
            </div>
          </div>
        `;
        return;
      }

      // 2. Auth Modal
      if (!currentUser) {
        app.innerHTML = `
          <div class="fixed inset-0 z-40 bg-black/95 flex items-center justify-center p-4">
            <div class="bg-zinc-900 border border-green-500/40 rounded-2xl p-6 w-full max-w-sm text-center shadow-[0_0_40px_rgba(0,255,65,0.15)] space-y-4">
              <div class="flex border-b border-zinc-800 pb-2">
                <button onclick="setAuthMode('signin')" class="flex-1 py-1.5 text-xs font-bold font-cyber-mono uppercase ${authMode === 'signin' ? 'text-green-400 border-b-2 border-green-400' : 'text-zinc-500'}">Sign In</button>
                <button onclick="setAuthMode('register')" class="flex-1 py-1.5 text-xs font-bold font-cyber-mono uppercase ${authMode === 'register' ? 'text-green-400 border-b-2 border-green-400' : 'text-zinc-500'}">Create Account</button>
              </div>
              <h2 class="text-lg font-bold font-cyber-mono text-green-400">${authMode === 'signin' ? 'ACCOUNT SIGN IN' : 'NEW REGISTRATION'}</h2>
              ${authMode === 'register' ? `
                <div>
                  <label class="relative w-20 h-20 mx-auto rounded-full bg-zinc-800 border-2 border-green-500 overflow-hidden flex items-center justify-center cursor-pointer block hover:border-green-400">
                    <img id="authAvatarPreview" src="https://api.dicebear.com/7.x/avataaars/svg?seed=New" class="w-full h-full object-cover" />
                    <input type="file" accept="image/*" onchange="previewAuthAvatar(event)" class="hidden" />
                  </label>
                  <p class="text-[11px] text-zinc-400 mt-1 font-cyber-mono">Tap circle to change picture *</p>
                </div>
              ` : ''}
              <form onsubmit="handleAuthSubmit(event)" class="space-y-3 text-left">
                <input id="authUsername" type="text" placeholder="Username (e.g. Alex)" required class="w-full bg-black border border-zinc-700 rounded-lg px-3.5 py-2.5 text-white text-sm font-cyber-mono focus:outline-none focus:border-green-400" />
                <input id="authPassword" type="password" placeholder="Password" required class="w-full bg-black border border-zinc-700 rounded-lg px-3.5 py-2.5 text-white text-sm font-cyber-mono focus:outline-none focus:border-green-400" />
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg font-cyber-mono uppercase text-sm transition cursor-pointer">
                  ${authMode === 'signin' ? 'Sign In & Enter' : 'Create Account'}
                </button>
              </form>
              <div id="authError" class="text-xs text-red-400 font-cyber-mono min-h-[16px]"></div>
              ${authMode === 'signin' ? `<p class="text-[11px] text-zinc-500 font-cyber-mono">Demo: <b>Alex</b> / <b>password</b> or <b>Maya</b> / <b>password</b></p>` : ''}
            </div>
          </div>
        `;
        return;
      }

      // 3. Main Dashboard & Internal Views
      let contentHtml = "";

      if (view === "dashboard") {
        const yourProducts = products.filter(p => p.userId === currentUser.uid);
        const otherProducts = products.filter(p => p.userId !== currentUser.uid);

        contentHtml = `
          <main class="max-w-5xl mx-auto px-4 py-6 space-y-8 bg-[#f8f9fa] min-h-[calc(100vh-60px)]">
            <!-- Your Products -->
            <section>
              <div class="flex items-center gap-1.5 mb-3">
                <h2 class="text-base font-semibold text-gray-800">Your</h2>
                ${Icons.chevronRight}
              </div>
              <div class="flex gap-4 overflow-x-auto pb-2">
                <button onclick="openCreateModal()" class="w-40 h-52 bg-white border-2 border-dashed border-blue-600 rounded-xl flex flex-col items-center justify-center gap-2 text-blue-600 hover:bg-blue-50/50 shrink-0 transition cursor-pointer">
                  ${Icons.plusSquare}
                  <span class="text-xs font-semibold">Create</span>
                </button>
                ${yourProducts.map(p => `
                  <div onclick="openProductDetail('${p.id}')" class="w-40 h-52 bg-white border border-gray-200 rounded-xl p-2 flex flex-col hover:-translate-y-0.5 hover:shadow-md transition cursor-pointer shrink-0">
                    <img src="${p.photoURL}" alt="${p.name}" class="w-full h-32 object-cover rounded-lg bg-gray-100" />
                    <div class="pt-2 text-center">
                      <p class="text-sm font-semibold text-gray-900 truncate">${p.name}</p>
                      <p class="text-xs font-bold text-blue-600 mt-0.5">${p.currency} ${p.price}</p>
                    </div>
                  </div>
                `).join('')}
              </div>
            </section>

            <!-- Others Products -->
            <section>
              <div class="flex items-center gap-1.5 mb-3">
                <h2 class="text-base font-semibold text-gray-800">Others</h2>
                ${Icons.chevronDown}
              </div>
              ${otherProducts.length === 0 ? `
                <div class="bg-white border border-gray-200 rounded-xl p-8 text-center text-sm text-gray-400">
                  No products from other sellers yet. All non-human dummy items have been removed.
                </div>
              ` : `
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                  ${otherProducts.map(p => `
                    <div onclick="openProductDetail('${p.id}')" class="bg-white border border-gray-200 rounded-xl p-2.5 flex flex-col hover:-translate-y-0.5 hover:shadow-md transition cursor-pointer">
                      <img src="${p.photoURL}" alt="${p.name}" class="w-full h-32 object-cover rounded-lg bg-gray-100" />
                      <div class="pt-2">
                        <p class="text-sm font-semibold text-gray-900 truncate">${p.name}</p>
                        <p class="text-xs text-gray-500">${p.username}</p>
                        <p class="text-xs font-bold text-blue-600 mt-1">${p.currency} ${p.price}</p>
                      </div>
                    </div>
                  `).join('')}
                </div>
              `}
            </section>
          </main>
        `;
      } else if (view === "detail" && selectedProduct) {
        const isOwner = selectedProduct.userId === currentUser.uid;
        contentHtml = `
          <div class="min-h-[calc(100vh-60px)] bg-[#f8f9fa] px-4 py-6">
            <div class="max-w-2xl mx-auto bg-white border border-gray-200 rounded-2xl p-6 shadow-sm space-y-4">
              <div class="flex items-center gap-3 border-b border-gray-200 pb-3">
                <button onclick="setView('dashboard')" class="p-2 hover:bg-gray-100 rounded-full cursor-pointer">${Icons.back}</button>
                <h2 class="text-lg font-bold text-gray-900">${selectedProduct.name}</h2>
              </div>
              <img src="${selectedProduct.photoURL}" alt="${selectedProduct.name}" class="w-full max-h-80 object-cover rounded-xl border border-gray-200" />
              <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold text-gray-900">${selectedProduct.name}</h1>
                <span class="text-xl font-bold text-blue-600">${selectedProduct.currency} ${selectedProduct.price}</span>
              </div>
              <p class="text-gray-600 text-sm whitespace-pre-wrap">${selectedProduct.description || 'No description provided.'}</p>
              <div class="flex items-center justify-between p-4 bg-gray-50 border border-gray-200 rounded-xl">
                <div class="flex items-center gap-3">
                  <img src="${selectedProduct.userPhoto}" alt="${selectedProduct.username}" class="w-10 h-10 rounded-full object-cover border" />
                  <div>
                    <p class="text-xs text-gray-500">Seller</p>
                    <p class="font-bold text-gray-900 text-sm">${selectedProduct.username}</p>
                  </div>
                </div>
                ${isOwner ? `
                  <button onclick="deleteProduct('${selectedProduct.id}')" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-1.5 cursor-pointer">
                    ${Icons.trash} Delete
                  </button>
                ` : `
                  <button onclick="openChatFromProduct()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 cursor-pointer">
                    ${Icons.chat} Chat
                  </button>
                `}
              </div>
            </div>
          </div>
        `;
      } else if (view === "chat" && chatPeer) {
        // Chat View with requirement 3 logic
        const recipient = users.find(u => u.uid === chatPeer.uid) || chatPeer;
        const isBlockedByMe = currentUser.blockedUsers && currentUser.blockedUsers.includes(recipient.uid);
        const isBlockedByThem = recipient.blockedUsers && recipient.blockedUsers.includes(currentUser.uid);

        const threadMessages = messages.filter(
          m => (m.senderId === currentUser.uid && m.recipientId === recipient.uid) ||
               (m.senderId === recipient.uid && m.recipientId === currentUser.uid)
        );

        contentHtml = `
          <div class="h-[calc(100vh-60px)] flex flex-col bg-white max-w-2xl mx-auto border-x border-gray-200">
            <!-- Chat Top Bar -->
            <div class="flex items-center justify-between p-3 border-b bg-white relative">
              <div class="flex items-center gap-3">
                <button onclick="setView('dashboard')" class="p-2 hover:bg-gray-100 rounded-full cursor-pointer">${Icons.back}</button>
                <img src="${recipient.photoURL}" alt="${recipient.username}" class="w-9 h-9 rounded-full object-cover border" />
                <h3 class="font-bold text-gray-900">${recipient.username}</h3>
              </div>
              <!-- Requirement 3: 3 Dots Menu with Block -->
              <div class="relative">
                <button onclick="toggleChatMenu()" class="p-2 text-gray-600 hover:text-gray-900 rounded-full hover:bg-gray-100 cursor-pointer">
                  ${Icons.dots}
                </button>
                ${chatMenuOpen ? `
                  <div class="absolute right-0 top-11 bg-white border border-gray-200 shadow-xl rounded-xl py-1 w-32 z-50">
                    <button onclick="toggleBlockUser('${recipient.uid}')" class="w-full text-left px-4 py-2.5 text-sm font-bold cursor-pointer transition ${isBlockedByMe ? 'text-blue-600 hover:bg-blue-50' : 'text-red-600 hover:bg-red-50'}">
                      ${isBlockedByMe ? 'Unblock' : 'Block'}
                    </button>
                  </div>
                ` : ''}
              </div>
            </div>

            <!-- Messages Stream -->
            <div id="messagesStream" class="flex-1 p-4 space-y-3 overflow-y-auto bg-gray-50">
              ${threadMessages.length === 0 ? `
                <p class="text-center text-xs text-gray-400 mt-10">Start your conversation with ${recipient.username}!</p>
              ` : threadMessages.map(m => {
                const isMe = m.senderId === currentUser.uid;
                return `
                  <div class="flex ${isMe ? 'justify-end' : 'justify-start'}">
                    <div class="max-w-[78%] px-4 py-2.5 rounded-2xl text-sm shadow-xs ${isMe ? 'bg-blue-600 text-white rounded-br-none' : 'bg-white border text-gray-800 rounded-bl-none'}">
                      ${m.mediaItems && m.mediaItems.length > 0 ? `
                        <div class="grid grid-cols-2 gap-1.5 mb-2">
                          ${m.mediaItems.map(item => item.isVideo ? `
                            <video src="${item.src}" controls class="w-full h-28 rounded-lg object-cover bg-black col-span-2"></video>
                          ` : `
                            <img src="${item.src}" class="w-full h-28 object-cover rounded-lg border" />
                          `).join('')}
                        </div>
                      ` : ''}
                      ${m.text ? `<p class="whitespace-pre-wrap">${m.text}</p>` : ''}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <!-- Staged Media Tray -->
            ${stagedMedia.length > 0 ? `
              <div class="p-2.5 bg-gray-100 border-t flex gap-2 overflow-x-auto">
                ${stagedMedia.map((item, idx) => `
                  <div class="relative w-16 h-16 rounded-lg overflow-hidden border border-gray-300 bg-white shrink-0">
                    ${item.isVideo ? `<video src="${item.src}" class="w-full h-full object-cover"></video>` : `<img src="${item.src}" class="w-full h-full object-cover" />`}
                    <button onclick="removeStagedMedia(${idx})" class="absolute top-0.5 right-0.5 w-5 h-5 bg-black/70 text-white rounded-full flex items-center justify-center hover:bg-red-600">${Icons.close}</button>
                  </div>
                `).join('')}
              </div>
            ` : ''}

            <!-- Bottom Chat Form / Blocked Bar -->
            ${isBlockedByThem ? `
              <!-- Requirement 3: User getting blocked sees "You're Blocked" in the text box place -->
              <div class="p-4 bg-gray-100 text-center text-sm font-bold text-red-600 border-t tracking-wide select-none">
                You're Blocked
              </div>
            ` : isBlockedByMe ? `
              <!-- Only who blocked can unblock him -->
              <div class="p-3 bg-gray-100 flex items-center justify-between border-t px-5">
                <span class="text-xs text-gray-600 font-medium">You have blocked this user.</span>
                <button onclick="toggleBlockUser('${recipient.uid}')" class="text-blue-600 hover:underline font-bold text-sm cursor-pointer">Unblock</button>
              </div>
            ` : `
              <!-- Normal input with plus icon for multiple photos/videos -->
              <form onsubmit="handleSendMessage(event)" class="p-3 border-t bg-white flex items-center gap-2">
                <label class="p-2 text-gray-500 hover:text-blue-600 rounded-full hover:bg-gray-100 cursor-pointer" title="Add multiple photos or videos">
                  ${Icons.plus}
                  <input type="file" multiple accept="image/*,video/*" onchange="handleChatFiles(event)" class="hidden" />
                </label>
                <input id="chatTextInput" type="text" placeholder="Type a message..." class="flex-1 bg-gray-100 border rounded-full px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500 text-gray-900" />
                <button type="submit" class="w-10 h-10 rounded-full bg-blue-600 hover:bg-blue-700 text-white flex items-center justify-center shrink-0 transition cursor-pointer">
                  ${Icons.send}
                </button>
              </form>
            `}
          </div>
        `;
      }

      app.innerHTML = `
        <!-- TopBar -->
        <header class="sticky top-0 z-40 flex items-center justify-between gap-4 px-4 py-2.5 bg-white border-b border-gray-200">
          <div class="flex items-center gap-3">
            <!-- Requirement 2: 3 lines button opens Friends Sidebar -->
            <button onclick="openFriendsDrawer()" class="p-2 rounded-full hover:bg-gray-100 text-gray-700 cursor-pointer" title="Friends">
              ${Icons.menu}
            </button>
            <!-- Requirement 1: Profile click opens Account Profile Sidebar -->
            <button onclick="openProfileDrawer()" class="flex items-center gap-2 hover:bg-gray-100 rounded-full pr-3 cursor-pointer" title="Account Settings">
              <img src="${currentUser.photoURL}" alt="${currentUser.username}" class="w-8 h-8 rounded-full object-cover border border-gray-300" />
              <span class="font-semibold text-gray-900 text-sm">${currentUser.username}</span>
            </button>
            <span class="text-xs font-bold uppercase tracking-widest text-gray-400 pl-2 border-l border-gray-200">business</span>
          </div>
          <button onclick="openSearchModal()" class="p-2 rounded-full hover:bg-gray-100 text-gray-600 cursor-pointer">
            ${Icons.search}
          </button>
        </header>

        ${contentHtml}

        <!-- Requirement 2: Friends Sidebar Drawer -->
        ${friendsDrawerOpen ? `
          <div class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex">
            <div class="bg-white text-gray-900 w-80 max-w-[85vw] h-full shadow-2xl flex flex-col p-4 border-r border-gray-200">
              <div class="flex justify-between items-center pb-3 border-b border-gray-200 mb-4">
                <h2 class="text-xl font-black text-gray-900 tracking-wide">Friends</h2>
                <button onclick="closeFriendsDrawer()" class="p-2 text-gray-500 hover:text-gray-900 rounded-full hover:bg-gray-100 cursor-pointer">${Icons.close}</button>
              </div>
              <div class="flex-1 overflow-y-auto space-y-2">
                ${getFriendsListHtml()}
              </div>
            </div>
            <div class="flex-1" onclick="closeFriendsDrawer()"></div>
          </div>
        ` : ''}

        <!-- Requirement 1: Account Profile Sidebar Drawer -->
        ${profileDrawerOpen ? `
          <div class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex justify-end">
            <div class="flex-1" onclick="closeProfileDrawer()"></div>
            <div class="bg-white text-gray-900 w-80 max-w-[85vw] h-full shadow-2xl flex flex-col p-6">
              <div class="flex items-center justify-between pb-4 border-b border-gray-200 mb-6">
                <span class="text-base font-bold text-gray-800">Account Profile</span>
                <button onclick="closeProfileDrawer()" class="p-2 text-gray-600 hover:text-gray-900 rounded-full hover:bg-gray-100 cursor-pointer" title="Go Back">
                  ${Icons.close}
                </button>
              </div>
              <div class="flex flex-col items-center flex-1 space-y-4 text-center">
                ${isEditingProfile ? `
                  <label class="relative w-24 h-24 rounded-full border-2 border-dashed border-blue-500 overflow-hidden flex items-center justify-center cursor-pointer group">
                    <img id="editProfilePicPreview" src="${currentUser.photoURL}" class="w-full h-full object-cover" />
                    <span class="absolute inset-0 bg-black/40 text-white text-[10px] flex items-center justify-center opacity-0 group-hover:opacity-100 transition">Change</span>
                    <input type="file" accept="image/*" onchange="previewEditPhoto(event)" class="hidden" />
                  </label>
                  <input id="editUsernameInput" type="text" value="${currentUser.username}" class="border rounded-lg px-3 py-1.5 text-sm text-center font-bold focus:outline-none focus:border-blue-500" />
                ` : `
                  <img src="${currentUser.photoURL}" alt="${currentUser.username}" class="w-24 h-24 rounded-full object-cover border-4 border-blue-500 shadow-md" />
                  <div>
                    <h3 class="text-xl font-bold text-gray-900">${currentUser.username}</h3>
                    <p class="text-xs text-gray-400 mt-0.5">UID: ${currentUser.uid.slice(0, 10)}</p>
                  </div>
                `}
                <div class="w-full pt-6 space-y-3">
                  ${isEditingProfile ? `
                    <button onclick="saveProfileChanges()" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-bold transition cursor-pointer">Save Changes</button>
                  ` : `
                    <button onclick="startEditingProfile()" class="w-full py-2.5 px-4 bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 transition cursor-pointer">
                      ${Icons.pencil} Edit Profile
                    </button>
                  `}
                  <button onclick="resetProfileForm()" title="Reset form" class="w-full py-2.5 px-4 bg-gray-50 hover:bg-gray-100 text-gray-700 border border-gray-200 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 transition cursor-pointer">
                    ${Icons.reset} Reset
                  </button>
                  <button onclick="handleLogOut()" class="w-full py-2.5 px-4 bg-gray-100 hover:bg-gray-200 text-gray-800 border border-gray-300 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 transition cursor-pointer">
                    ${Icons.logout} Log Out
                  </button>
                  <button onclick="handleDeleteAccount()" class="w-full py-2.5 px-4 bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 transition cursor-pointer">
                    ${Icons.trash} Delete Account
                  </button>
                </div>
              </div>
            </div>
          </div>
        ` : ''}

        <!-- Create Product Modal -->
        ${createModalOpen ? `
          <div class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
            <form onsubmit="handleCreateProductSubmit(event)" class="bg-white rounded-xl p-6 w-full max-w-md shadow-2xl space-y-4">
              <div class="flex justify-between items-center border-b pb-2">
                <h2 class="text-lg font-bold text-gray-900">Create Product</h2>
                <button type="button" onclick="closeCreateModal()" class="cursor-pointer">${Icons.close}</button>
              </div>
              <input id="newProdName" type="text" placeholder="Product Name (2-8 chars)" maxlength="8" required class="w-full border rounded-lg p-2.5 text-sm" />
              <div class="flex gap-2">
                <select id="newProdCurrency" class="border rounded-lg p-2.5 text-sm bg-white">
                  <option>$ USD</option>
                  <option>৳ TK</option>
                  <option>€ EUR</option>
                </select>
                <input id="newProdPrice" type="number" placeholder="Price" required class="flex-1 border rounded-lg p-2.5 text-sm" />
              </div>
              <textarea id="newProdDesc" placeholder="Description..." class="w-full border rounded-lg p-2.5 text-sm h-24"></textarea>
              <label class="border-2 border-dashed border-gray-300 rounded-lg p-4 flex flex-col items-center justify-center cursor-pointer hover:border-blue-500">
                <img id="newProdPhotoPreview" class="h-32 object-cover rounded-md hidden" />
                <span id="newProdPhotoText" class="text-xs text-gray-500">Click to upload product picture *</span>
                <input id="newProdFileInput" type="file" accept="image/*" onchange="previewProductPhoto(event)" class="hidden" required />
              </label>
              <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg text-sm cursor-pointer">Publish Product</button>
            </form>
          </div>
        ` : ''}

        <!-- Search Modal -->
        ${searchModalOpen ? `
          <div class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
            <div class="bg-white rounded-xl p-5 w-full max-w-sm space-y-3">
              <div class="flex justify-between items-center">
                <h3 class="font-bold">Search Products</h3>
                <button onclick="closeSearchModal()" class="cursor-pointer">${Icons.close}</button>
              </div>
              <input id="searchInput" type="text" oninput="handleSearch(event)" placeholder="Search products..." class="w-full border rounded-lg p-2.5 text-sm" />
              <div id="searchResults" class="max-h-52 overflow-y-auto space-y-2"></div>
            </div>
          </div>
        ` : ''}
      `;

      if (view === "chat") {
        const stream = document.getElementById("messagesStream");
        if (stream) stream.scrollTop = stream.scrollHeight;
      }
    }

    // --- ACTIONS & HANDLERS ---

    // Requirement 4: Ultra YouTube redirection & Gate Unlock
    window.handleGoToUltra = function() {
      window.open(SUB_URL, "_blank");
      setTimeout(() => {
        subUnlocked = true;
        save(K_SUB, true);
        render();
      }, 800);
    };

    // Auth Handlers
    window.setAuthMode = function(m) {
      authMode = m;
      render();
    };

    let tempAvatar = "https://api.dicebear.com/7.x/avataaars/svg?seed=New";
    window.previewAuthAvatar = function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        tempAvatar = reader.result;
        const img = document.getElementById("authAvatarPreview");
        if (img) img.src = reader.result;
      };
      reader.readAsDataURL(file);
    };

    window.handleAuthSubmit = function(e) {
      e.preventDefault();
      const u = document.getElementById("authUsername").value.trim();
      const p = document.getElementById("authPassword").value;
      const err = document.getElementById("authError");

      if (authMode === "signin") {
        const found = users.find(x => x.username.toLowerCase() === u.toLowerCase());
        if (!found || found.password !== p) {
          if (err) err.innerText = "Account not found or incorrect credentials!";
          return;
        }
        currentUser = found;
        save(K_USER, currentUser);
        view = "dashboard";
        render();
      } else {
        const exists = users.some(x => x.username.toLowerCase() === u.toLowerCase());
        if (exists) {
          if (err) err.innerText = "Username already taken. Try signing in.";
          return;
        }
        const newUser = {
          uid: `user_${Date.now()}`,
          username: u,
          password: p,
          photoURL: tempAvatar,
          blockedUsers: [],
          createdAt: new Date().toISOString()
        };
        users.push(newUser);
        save(K_USERS, users);
        currentUser = newUser;
        save(K_USER, currentUser);
        view = "dashboard";
        render();
      }
    };

    // Navigation & Views
    window.setView = function(v) {
      view = v;
      chatMenuOpen = false;
      render();
    };

    window.openProductDetail = function(id) {
      selectedProduct = products.find(p => p.id === id);
      view = "detail";
      render();
    };

    window.deleteProduct = function(id) {
      products = products.filter(p => p.id !== id);
      save(K_PRODUCTS, products);
      view = "dashboard";
      render();
    };

    window.openChatFromProduct = function() {
      if (!selectedProduct) return;
      chatPeer = users.find(u => u.uid === selectedProduct.userId) || {
        uid: selectedProduct.userId,
        username: selectedProduct.username,
        photoURL: selectedProduct.userPhoto,
        blockedUsers: []
      };
      view = "chat";
      render();
    };

    window.startChatWithPeer = function(uid) {
      chatPeer = users.find(u => u.uid === uid);
      friendsDrawerOpen = false;
      view = "chat";
      render();
    };

    // Requirement 2: Friends sidebar computation
    function getFriendsListHtml() {
      const interacted = new Set();
      messages.forEach(m => {
        if (m.senderId === currentUser.uid) interacted.add(m.recipientId);
        if (m.recipientId === currentUser.uid) interacted.add(m.senderId);
      });

      const friendUsers = users.filter(u => u.uid !== currentUser.uid && interacted.has(u.uid));
      const otherUsers = users.filter(u => u.uid !== currentUser.uid && !interacted.has(u.uid));

      if (friendUsers.length === 0 && otherUsers.length === 0) {
        return `<p class="text-xs text-gray-400 text-center py-8">No other accounts found.</p>`;
      }

      let html = "";
      if (friendUsers.length > 0) {
        html += friendUsers.map(peer => {
          const lastMsg = [...messages].reverse().find(
            m => (m.senderId === currentUser.uid && m.recipientId === peer.uid) ||
                 (m.senderId === peer.uid && m.recipientId === currentUser.uid)
          );
          return `
            <button onclick="startChatWithPeer('${peer.uid}')" class="w-full flex items-center gap-3 p-2.5 rounded-xl hover:bg-blue-50 transition text-left cursor-pointer border border-transparent hover:border-blue-200">
              <img src="${peer.photoURL}" alt="${peer.username}" class="w-11 h-11 rounded-full object-cover border shrink-0" />
              <div class="flex-1 min-w-0">
                <p class="font-bold text-sm text-gray-900 truncate">${peer.username}</p>
                <p class="text-xs text-gray-500 truncate mt-0.5">${lastMsg ? (lastMsg.text || 'Media attachment') : 'Tap to chat'}</p>
              </div>
            </button>
          `;
        }).join('');
      } else {
        html += `<p class="text-xs text-gray-400 text-center py-4">No active conversations yet.</p>`;
      }

      if (otherUsers.length > 0) {
        html += `
          <div class="pt-4 border-t border-gray-100">
            <p class="text-[11px] font-bold uppercase tracking-wider text-gray-400 px-2 mb-2">Other Accounts</p>
            ${otherUsers.map(peer => `
              <button onclick="startChatWithPeer('${peer.uid}')" class="w-full flex items-center gap-3 p-2 rounded-xl hover:bg-gray-100 transition text-left cursor-pointer">
                <img src="${peer.photoURL}" alt="${peer.username}" class="w-9 h-9 rounded-full object-cover border shrink-0" />
                <p class="font-semibold text-sm text-gray-800 truncate">${peer.username}</p>
              </button>
            `).join('')}
          </div>
        `;
      }
      return html;
    }

    // Drawers
    window.openFriendsDrawer = () => { friendsDrawerOpen = true; render(); };
    window.closeFriendsDrawer = () => { friendsDrawerOpen = false; render(); };
    window.openProfileDrawer = () => { profileDrawerOpen = true; isEditingProfile = false; render(); };
    window.closeProfileDrawer = () => { profileDrawerOpen = false; isEditingProfile = false; render(); };

    // Requirement 1: Profile Drawer Actions
    window.startEditingProfile = () => { isEditingProfile = true; render(); };
    window.resetProfileForm = () => { isEditingProfile = false; render(); };

    let tempEditPhoto = null;
    window.previewEditPhoto = (e) => {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        tempEditPhoto = r.result;
        const img = document.getElementById("editProfilePicPreview");
        if (img) img.src = r.result;
      };
      r.readAsDataURL(f);
    };

    window.saveProfileChanges = () => {
      const name = document.getElementById("editUsernameInput").value.trim();
      if (!name) return;
      currentUser.username = name;
      if (tempEditPhoto) currentUser.photoURL = tempEditPhoto;
      users = users.map(u => u.uid === currentUser.uid ? currentUser : u);
      products = products.map(p => p.userId === currentUser.uid ? { ...p, username: currentUser.username, userPhoto: currentUser.photoURL } : p);
      save(K_USERS, users);
      save(K_PRODUCTS, products);
      save(K_USER, currentUser);
      isEditingProfile = false;
      render();
    };

    window.handleLogOut = () => {
      currentUser = null;
      localStorage.removeItem(K_USER);
      profileDrawerOpen = false;
      view = "dashboard";
      render();
    };

    window.handleDeleteAccount = () => {
      if (confirm("Are you sure you want to delete your account?")) {
        users = users.filter(u => u.uid !== currentUser.uid);
        products = products.filter(p => p.userId !== currentUser.uid);
        save(K_USERS, users);
        save(K_PRODUCTS, products);
        handleLogOut();
      }
    };

    // Requirement 3: Chat Multi-media & Block logic
    window.toggleChatMenu = () => {
      chatMenuOpen = !chatMenuOpen;
      render();
    };

    window.toggleBlockUser = (targetUid) => {
      const blocks = currentUser.blockedUsers || [];
      const isBlocked = blocks.includes(targetUid);
      currentUser.blockedUsers = isBlocked
        ? blocks.filter(id => id !== targetUid)
        : [...blocks, targetUid];

      users = users.map(u => u.uid === currentUser.uid ? currentUser : u);
      save(K_USERS, users);
      save(K_USER, currentUser);
      chatMenuOpen = false;
      render();
    };

    window.handleChatFiles = (e) => {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;
      files.forEach(f => {
        const isVideo = f.type.startsWith("video");
        const r = new FileReader();
        r.onload = () => {
          stagedMedia.push({ src: r.result, isVideo });
          render();
        };
        r.readAsDataURL(f);
      });
    };

    window.removeStagedMedia = (idx) => {
      stagedMedia.splice(idx, 1);
      render();
    };

    window.handleSendMessage = (e) => {
      e.preventDefault();
      const txt = document.getElementById("chatTextInput").value.trim();
      if (!txt && stagedMedia.length === 0) return;

      const newMsg = {
        id: `m_${Date.now()}`,
        senderId: currentUser.uid,
        recipientId: chatPeer.uid,
        text: txt,
        mediaItems: [...stagedMedia],
        timestamp: new Date().toISOString()
      };

      messages.push(newMsg);
      save(K_MESSAGES, messages);
      stagedMedia = [];
      render();
    };

    // Product Creation Modal
    window.openCreateModal = () => { createModalOpen = true; render(); };
    window.closeCreateModal = () => { createModalOpen = false; render(); };

    let tempProdPhoto = "";
    window.previewProductPhoto = (e) => {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        tempProdPhoto = r.result;
        const img = document.getElementById("newProdPhotoPreview");
        const txt = document.getElementById("newProdPhotoText");
        if (img) { img.src = r.result; img.classList.remove("hidden"); }
        if (txt) txt.classList.add("hidden");
      };
      r.readAsDataURL(f);
    };

    window.handleCreateProductSubmit = (e) => {
      e.preventDefault();
      const name = document.getElementById("newProdName").value.trim();
      const curr = document.getElementById("newProdCurrency").value;
      const price = document.getElementById("newProdPrice").value.trim();
      const desc = document.getElementById("newProdDesc").value.trim();

      if (!name || !price || !tempProdPhoto) return;

      const newP = {
        id: `p_${Date.now()}`,
        name: name,
        currency: curr,
        price: price,
        description: desc,
        photoURL: tempProdPhoto,
        userId: currentUser.uid,
        username: currentUser.username,
        userPhoto: currentUser.photoURL,
        createdAt: new Date().toISOString()
      };

      products.unshift(newP);
      save(K_PRODUCTS, products);
      tempProdPhoto = "";
      createModalOpen = false;
      render();
    };

    // Search
    window.openSearchModal = () => { searchModalOpen = true; render(); };
    window.closeSearchModal = () => { searchModalOpen = false; render(); };
    window.handleSearch = (e) => {
      const q = e.target.value.toLowerCase().trim();
      const resEl = document.getElementById("searchResults");
      if (!resEl) return;
      if (!q) { resEl.innerHTML = ""; return; }

      const matches = products.filter(p => p.name.toLowerCase().includes(q) || p.username.toLowerCase().includes(q));
      if (matches.length === 0) {
        resEl.innerHTML = `<p class="text-xs text-gray-500 text-center py-4">No products found.</p>`;
        return;
      }
      resEl.innerHTML = matches.map(p => `
        <div onclick="openProductDetail('${p.id}'); closeSearchModal();" class="p-2 border rounded-lg flex items-center gap-3 cursor-pointer hover:bg-gray-50">
          <img src="${p.photoURL}" class="w-10 h-10 object-cover rounded" />
          <div>
            <p class="font-semibold text-sm">${p.name}</p>
            <p class="text-xs text-blue-600 font-bold">${p.currency} ${p.price}</p>
          </div>
        </div>
      `).join('');
    };

    // Initial mount
    window.onload = render;
  </script>
</body>
  </html>
