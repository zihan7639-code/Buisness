<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Business Marketplace</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      margin: 0;
      background-color: #f8f9fa;
      color: #111827;
      overflow-x: hidden;
    }
    .font-cyber { font-family: 'Orbitron', sans-serif; }
    .font-cyber-mono { font-family: 'Share Tech Mono', monospace; }
  </style>
</head>
<body class="bg-[#f8f9fa] text-gray-900 min-h-screen">
  <div id="app"></div>

  <script>
    // --- STORAGE & STATE CONFIG ---
    const SUB_URL = "https://www.youtube.com/@Ultra-Gaming-2.O-Official";
    const K_SUB = "app_ultra_unlocked";
    const K_USER = "app_auth_user";
    const K_USERS = "app_users_list";
    const K_PRODUCTS = "app_products_list";
    const K_MESSAGES = "app_messages_list";

    function load(key, fallback) {
      try {
        const d = localStorage.getItem(key);
        return d ? JSON.parse(d) : fallback;
      } catch (e) {
        return fallback;
      }
    }
    function save(key, val) {
      try {
        localStorage.setItem(key, JSON.stringify(val));
      } catch (e) {}
    }

    // State Variables (Non-human accounts purged)
    let subUnlocked = load(K_SUB, false);
    let users = load(K_USERS, []).filter(u => u.uid !== 'u_alex' && u.uid !== 'u_maya');
    let currentUser = load(K_USER, null);
    if (currentUser && (currentUser.uid === 'u_alex' || currentUser.uid === 'u_maya')) {
      currentUser = null;
    }
    let products = load(K_PRODUCTS, []);
    let messages = load(K_MESSAGES, []);

    let view = "dashboard"; // 'dashboard' | 'detail' | 'chat'
    let selectedProduct = null;
    let chatPeer = null;
    let authMode = "signin"; // 'signin' | 'register'

    // Drawers & Modals
    let friendsDrawerOpen = false;
    let profileDrawerOpen = false;
    let createModalOpen = false;
    let searchModalOpen = false;
    let chatMenuOpen = false;
    let stagedMedia = [];
    let isEditingProfile = false;
    let zoomedPhotoUrl = null; // Photo zoom state

    // SVG Icons
    const Icons = {
      menu: `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>`,
      search: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" stroke-width="2"/><path d="m21 21-4.3-4.3" stroke-width="2"/></svg>`,
      plus: `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="M12 5v14M5 12h14"/></svg>`,
      plusSquare: `<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2" stroke-width="2"/><path stroke-linecap="round" stroke-width="2" d="M12 8v8M8 12h8"/></svg>`,
      close: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="M18 6 6 18M6 6l12 12"/></svg>`,
      back: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="m12 19-7-7 7-7M19 12H5"/></svg>`,
      dots: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="19" r="1.5" fill="currentColor"/></svg>`,
      send: `<svg class="w-4 h-4 ml-0.5" viewBox="0 0 24 24" fill="currentColor"><path d="M3.478 2.405a.75.75 0 0 0-.926.94l2.432 7.905H13.5a.75.75 0 0 1 0 1.5H4.984l-2.432 7.905a.75.75 0 0 0 .926.94 60.519 60.519 0 0 0 18.445-8.986.75.75 0 0 0 0-1.218A60.517 60.517 0 0 0 3.478 2.405Z"/></svg>`,
      pencil: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>`,
      trash: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>`,
      reset: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path stroke-width="2" d="M3 3v5h5"/></svg>`,
      logout: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>`,
      chat: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>`,
      chevronRight: `<svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="m9 18 6-6-6-6"/></svg>`,
      chevronDown: `<svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="m6 9 6 6 6-6"/></svg>`
    };

    // --- RENDER ENGINE ---
    function render() {
      const app = document.getElementById("app");
      if (!app) return;

      // 1. Subscription Gate
      if (!subUnlocked) {
        app.innerHTML = `
          <div class="fixed inset-0 z-50 flex items-center justify-center bg-black p-4 select-none">
            <div class="relative z-10 w-full max-w-[420px] bg-black/90 border border-green-500 rounded-xl p-8 font-cyber-mono text-green-400 shadow-[0_0_30px_rgba(0,255,65,0.2)] text-center">
              <span class="text-4xl block mb-2 text-red-500 animate-bounce">⚠</span>
              <h1 class="font-cyber text-xl font-black text-red-500">SUB TO ULTRA</h1>
              <p class="text-xs text-red-400 mt-1">Subscription Required for Access</p>
              <button onclick="handleGoToUltra()" class="w-full py-3.5 px-4 mt-6 border border-red-500 bg-red-500/10 hover:bg-red-500/25 text-red-400 font-cyber font-bold text-sm tracking-widest rounded-lg transition cursor-pointer">
                [ SIGN IN TO ULTRA ]
              </button>
              <p class="mt-3 text-[11px] text-zinc-500">Opens Ultra-Gaming-2.O-Official on YouTube to unlock access</p>
            </div>
          </div>
        `;
        return;
      }

      // 2. Auth Modal
      if (!currentUser) {
        app.innerHTML = `
          <div class="fixed inset-0 z-40 bg-black/95 flex items-center justify-center p-4">
            <div class="bg-zinc-900 border border-green-500/40 rounded-2xl p-6 w-full max-w-sm text-center shadow-[0_0_40px_rgba(0,255,65,0.15)] space-y-4">
              <div class="flex border-b border-zinc-800 pb-2">
                <button onclick="setAuthMode('signin')" class="flex-1 py-1.5 text-xs font-bold font-cyber-mono uppercase ${authMode === 'signin' ? 'text-green-400 border-b-2 border-green-400' : 'text-zinc-500'}">Sign In</button>
                <button onclick="setAuthMode('register')" class="flex-1 py-1.5 text-xs font-bold font-cyber-mono uppercase ${authMode === 'register' ? 'text-green-400 border-b-2 border-green-400' : 'text-zinc-500'}">Create Account</button>
              </div>
              <h2 class="text-lg font-bold font-cyber-mono text-green-400">${authMode === 'signin' ? 'ACCOUNT SIGN IN' : 'NEW REGISTRATION'}</h2>
              ${authMode === 'register' ? `
                <div>
                  <label class="relative w-20 h-20 mx-auto rounded-full bg-zinc-800 border-2 border-green-500 overflow-hidden flex items-center justify-center cursor-pointer block hover:border-green-400">
                    <img id="authAvatarPreview" src="https://api.dicebear.com/7.x/avataaars/svg?seed=New" class="w-full h-full object-cover" />
                    <input type="file" accept="image/*" onchange="previewAuthAvatar(event)" class="hidden" />
                  </label>
                  <p class="text-[11px] text-zinc-400 mt-1 font-cyber-mono">Tap circle to change picture *</p>
                </div>
              ` : ''}
              <form onsubmit="handleAuthSubmit(event)" class="space-y-3 text-left">
                <input id="authUsername" type="text" placeholder="Username" required class="w-full bg-black border border-zinc-700 rounded-lg px-3.5 py-2.5 text-white text-sm font-cyber-mono focus:outline-none focus:border-green-400" />
                <input id="authPassword" type="password" placeholder="Password" required class="w-full bg-black border border-zinc-700 rounded-lg px-3.5 py-2.5 text-white text-sm font-cyber-mono focus:outline-none focus:border-green-400" />
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg font-cyber-mono uppercase text-sm transition cursor-pointer">
                  ${authMode === 'signin' ? 'Sign In & Enter' : 'Create Account'}
                </button>
              </form>
              <div id="authError" class="text-xs text-red-400 font-cyber-mono min-h-[16px]"></div>
            </div>
          </div>
        `;
        return;
      }

      // 3. Main Dashboard & Internal Views
      let contentHtml = "";

      if (view === "dashboard") {
        const yourProducts = products.filter(p => p.userId === currentUser.uid);
        const otherProducts = products.filter(p => p.userId !== currentUser.uid);

        contentHtml = `
          <main class="max-w-5xl mx-auto px-4 py-6 space-y-8 bg-[#f8f9fa] min-h-[calc(100vh-60px)]">
            <!-- Your Products -->
            <section>
              <div class="flex items-center gap-1.5 mb-3">
                <h2 class="text-base font-semibold text-gray-800">Your</h2>
                ${Icons.chevronRight}
              </div>
              <div class="flex gap-4 overflow-x-auto pb-2">
                <button onclick="openCreateModal()" class="w-40 h-52 bg-white border-2 border-dashed border-blue-600 rounded-xl flex flex-col items-center justify-center gap-2 text-blue-600 hover:bg-blue-50/50 shrink-0 transition cursor-pointer">
                  ${Icons.plusSquare}
                  <span class="text-xs font-semibold">Create</span>
                </button>
                ${yourProducts.map(p => `
                  <div onclick="openProductDetail('${p.id}')" class="w-40 h-52 bg-white border border-gray-200 rounded-xl p-2 flex flex-col hover:-translate-y-0.5 hover:shadow-md transition cursor-pointer shrink-0">
                    <img src="${p.photoURL}" alt="${p.name}" class="w-full h-32 object-cover rounded-lg bg-gray-100" />
                    <div class="pt-2 text-center">
                      <p class="text-sm font-semibold text-gray-900 truncate">${p.name}</p>
                      <p class="text-xs font-bold text-blue-600 mt-0.5">${p.currency} ${p.price}</p>
                    </div>
                  </div>
                `).join('')}
              </div>
            </section>

            <!-- Others Products -->
            <section>
              <div class="flex items-center gap-1.5 mb-3">
                <h2 class="text-base font-semibold text-gray-800">Others</h2>
                ${Icons.chevronDown}
              </div>
              ${otherProducts.length === 0 ? `
                <div class="bg-white border border-gray-200 rounded-xl p-8 text-center text-sm text-gray-400">
                  No products from other sellers yet.
                </div>
              ` : `
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                  ${otherProducts.map(p => `
                    <div onclick="openProductDetail('${p.id}')" class="bg-white border border-gray-200 rounded-xl p-2.5 flex flex-col hover:-translate-y-0.5 hover:shadow-md transition cursor-pointer">
                      <img src="${p.photoURL}" alt="${p.name}" class="w-full h-32 object-cover rounded-lg bg-gray-100" />
                      <div class="pt-2">
                        <p class="text-sm font-semibold text-gray-900 truncate">${p.name}</p>
                        <p class="text-xs text-gray-500">${p.username}</p>
                        <p class="text-xs font-bold text-blue-600 mt-1">${p.currency} ${p.price}</p>
                      </div>
                    </div>
                  `).join('')}
                </div>
              `}
            </section>
          </main>
        `;
      } else if (view === "detail" && selectedProduct) {
        const isOwner = selectedProduct.userId === currentUser.uid;
        contentHtml = `
          <div class="min-h-[calc(100vh-60px)] bg-[#f8f9fa] px-4 py-6">
            <div class="max-w-2xl mx-auto bg-white border border-gray-200 rounded-2xl p-6 shadow-sm space-y-4">
              <div class="flex items-center gap-3 border-b border-gray-200 pb-3">
                <button onclick="setView('dashboard')" class="p-2 hover:bg-gray-100 rounded-full cursor-pointer">${Icons.back}</button>
                <h2 class="text-lg font-bold text-gray-900">${selectedProduct.name}</h2>
              </div>
              <!-- Pressing product photo makes it bigger -->
              <img src="${selectedProduct.photoURL}" alt="${selectedProduct.name}" onclick="openPhotoModal('${selectedProduct.photoURL}')" class="w-full max-h-80 object-cover rounded-xl border border-gray-200 cursor-zoom-in hover:opacity-95 transition" title="Click to see bigger" />
              <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold text-gray-900">${selectedProduct.name}</h1>
                <span class="text-xl font-bold text-blue-600">${selectedProduct.currency} ${selectedProduct.price}</span>
              </div>
              <p class="text-gray-600 text-sm whitespace-pre-wrap">${selectedProduct.description || 'No description provided.'}</p>
              <div class="flex items-center justify-between p-4 bg-gray-50 border border-gray-200 rounded-xl">
                <div class="flex items-center gap-3">
                  <img src="${selectedProduct.userPhoto}" alt="${selectedProduct.username}" class="w-10 h-10 rounded-full object-cover border" />
                  <div>
                    <p class
