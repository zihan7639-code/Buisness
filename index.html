<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Business Marketplace</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->

  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      margin: 0;
      background-color: #000;
      overflow-x: hidden;
    }
    .font-cyber { font-family: 'Orbitron', sans-serif; }
    .font-cyber-mono { font-family: 'Share Tech Mono', monospace; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SUB_CHANNEL_URL = 'https://www.youtube.com/@Ultra-Gaming-2.O-Official';
    const SUB_STORAGE_KEY = 'ultra_sub_unlocked_v1';
    const USER_STORAGE_KEY = 'business_auth_user_v1';
    const USERS_STORAGE_KEY = 'business_users_list_v1';
    const PRODUCTS_STORAGE_KEY = 'business_products_list_v1';
    const MESSAGES_STORAGE_KEY = 'business_messages_list_v1';

    // Initial Demo Users
    const INITIAL_USERS = [
      { uid: 'u_alex', username: 'Alex', password: 'password', photoURL: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150', blockedUsers: [] },
      { uid: 'u_maya', username: 'Maya', password: 'password', photoURL: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150', blockedUsers: [] }
    ];

    // Initial Demo Products
    const INITIAL_PRODUCTS = [
      { id: 'p1', name: 'Camera', price: '450', currency: '$ USD', description: 'Retro 35mm compact digital camera.', photoURL: 'https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=600', userId: 'u_alex', username: 'Alex', userPhoto: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150', createdAt: new Date().toISOString() },
      { id: 'p2', name: 'Watch', price: '220', currency: '$ USD', description: 'Brushed steel timepiece.', photoURL: 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600', userId: 'u_maya', username: 'Maya', userPhoto: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150', createdAt: new Date().toISOString() }
    ];

    const getStored = (k, fallback) => {
      try {
        const item = localStorage.getItem(k);
        return item ? JSON.parse(item) : fallback;
      } catch {
        return fallback;
      }
    };
    const setStored = (k, v) => localStorage.setItem(k, JSON.stringify(v));

    // SVG Icons
    const Icons = {
      Search: (p) => <svg {...p} fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" strokeWidth="2"/><path d="m21 21-4.3-4.3" strokeWidth="2"/></svg>,
      Menu: (p) => <svg {...p} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16"/></svg>,
      Plus: (p) => <svg {...p} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeWidth="2" d="M12 5v14M5 12h14"/></svg>,
      PlusSquare: (p) => <svg {...p} fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2" strokeWidth="2"/><path strokeLinecap="round" strokeWidth="2" d="M12 8v8M8 12h8"/></svg>,
      ChevronRight: (p) => <svg {...p} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeWidth="2" d="m9 18 6-6-6-6"/></svg>,
      ChevronDown: (p) => <svg {...p} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeWidth="2" d="m6 9 6 6 6-6"/></svg>,
      ArrowLeft: (p) => <svg {...p} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeWidth="2" d="m12 19-7-7 7-7M19 12H5"/></svg>,
      X: (p) => <svg {...p} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeWidth="2" d="M18 6 6 18M6 6l12 12"/></svg>,
      MessageCircle: (p) => <svg {...p} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeWidth="2" d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>,
      Pencil: (p) => <svg {...p} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeWidth="2" d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>,
      Trash2: (p) => <svg {...p} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeWidth="2" d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>,
      LogOut: (p) => <svg {...p} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeWidth="2" d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>,
      RotateCcw: (p) => <svg {...p} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeWidth="2" d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path strokeWidth="2" d="M3 3v5h5"/></svg>,
      MoreVertical: (p) => <svg {...p} fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="19" r="1.5" fill="currentColor"/></svg>,
      Send: (p) => <svg {...p} viewBox="0 0 24 24" fill="currentColor"><path d="M3.478 2.405a.75.75 0 0 0-.926.94l2.432 7.905H13.5a.75.75 0 0 1 0 1.5H4.984l-2.432 7.905a.75.75 0 0 0 .926.94 60.519 60.519 0 0 0 18.445-8.986.75.75 0 0 0 0-1.218A60.517 60.517 0 0 0 3.478 2.405Z"/></svg>
    };

    /* --- 1. SUBSCRIPTION GATE (Requirement 4) --- */
    function SubscriptionGate({ onUnlocked }) {
      const canvasRef = useRef(null);
      const [step, setStep] = useState('init');

      useEffect(() => {
        const timer = setTimeout(() => setStep('subscribe'), 1000);
        return () => clearTimeout(timer);
      }, []);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const drops = Array(Math.floor(canvas.width / 18)).fill(1);
        const chars = '01100';

        const id = setInterval(() => {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.06)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#00ff41';
          ctx.font = '14px monospace';
          for (let i = 0; i < drops.length; i++) {
            ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * 18, drops[i] * 18);
            if (drops[i] * 18 > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
          }
        }, 50);
        return () => clearInterval(id);
      }, []);

      const handleGoToUltra = () => {
        // Requirement 4: Opens the official YouTube channel and unlocks access
        window.open(SUB_CHANNEL_URL, '_blank');
        setTimeout(() => {
          onUnlocked();
        }, 800);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black p-4 select-none">
          <canvas ref={canvasRef} className="fixed inset-0 opacity-20 pointer-events-none" />
          <div className="relative z-10 w-full max-w-[420px] bg-black/90 border border-green-500 rounded-xl p-8 font-cyber-mono text-green-400 shadow-[0_0_30px_rgba(0,255,65,0.2)] text-center">
            {step === 'init' ? (
              <div>
                <span className="text-4xl block mb-2 animate-pulse">⬡</span>
                <h1 className="font-cyber text-lg font-bold">SYSTEM INIT</h1>
                <p className="text-xs text-green-300/80 mt-1">Verifying Gate Access...</p>
              </div>
            ) : (
              <div>
                <span className="text-4xl block mb-2 text-red-500 animate-bounce">⚠</span>
                <h1 className="font-cyber text-xl font-black text-red-500">SUB TO ULTRA</h1>
                <p className="text-xs text-red-400 mt-1">Subscription Required for Access</p>
                <button
                  type="button"
                  onClick={handleGoToUltra}
                  className="w-full py-3.5 px-4 mt-6 border border-red-500 bg-red-500/10 hover:bg-red-500/25 text-red-400 font-cyber font-bold text-sm tracking-widest rounded-lg transition active:scale-98"
                >
                  [ SIGN IN TO ULTRA ]
                </button>
                <p className="mt-3 text-[11px] text-zinc-500">Opens Ultra-Gaming-2.O-Official on YouTube to unlock</p>
              </div>
            )}
          </div>
        </div>
      );
    }

    /* --- AUTH MODAL --- */
    function AuthModal({ users, onSuccess, onRegisterUser }) {
      const [mode, setMode] = useState('signin');
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [avatarData, setAvatarData] = useState('');
      const [errorMsg, setErrorMsg] = useState('');

      const handleAvatarChange = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => setAvatarData(reader.result);
        reader.readAsDataURL(file);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        setErrorMsg('');
        const trimmed = username.trim();

        if (trimmed.length < 2) {
          setErrorMsg('Username must be at least 2 characters');
          return;
        }
        if (password.length < 2) {
          setErrorMsg('Password must be at least 2 characters');
          return;
        }

        if (mode === 'signin') {
          const found = users.find(u => u.username.toLowerCase() === trimmed.toLowerCase());
          if (!found || found.password !== password) {
            setErrorMsg('Account not found or incorrect credentials!');
            return;
          }
          onSuccess(found);
        } else {
          if (!avatarData) {
            setErrorMsg('Please tap circle to select a profile picture.');
            return;
          }
          const exists = users.some(u => u.username.toLowerCase() === trimmed.toLowerCase());
          if (exists) {
            setErrorMsg('Username already taken. Try signing in.');
            return;
          }
          const newUser = {
            uid: `user_${Date.now()}`,
            username: trimmed,
            password: password,
            photoURL: avatarData,
            blockedUsers: [],
            createdAt: new Date().toISOString()
          };
          onRegisterUser(newUser);
          onSuccess(newUser);
        }
      };

      return (
        <div className="fixed inset-0 z-40 bg-black/95 backdrop-blur-md flex items-center justify-center p-4">
          <form onSubmit={handleSubmit} className="bg-zinc-900 border border-green-500/40 rounded-2xl p-6 w-full max-w-sm text-center shadow-[0_0_40px_rgba(0,255,65,0.15)] space-y-4">
            <div className="flex border-b border-zinc-800 pb-2">
              <button
                type="button"
                onClick={() => { setMode('signin'); setErrorMsg(''); }}
                className={`flex-1 py-1.5 text-xs font-bold font-cyber-mono uppercase ${mode === 'signin' ? 'text-green-400 border-b-2 border-green-400' : 'text-zinc-500'}`}
              >
                Sign In
              </button>
              <button
                type="button"
                onClick={() => { setMode('register'); setErrorMsg(''); }}
                className={`flex-1 py-1.5 text-xs font-bold font-cyber-mono uppercase ${mode === 'register' ? 'text-green-400 border-b-2 border-green-400' : 'text-zinc-500'}`}
              >
                Create Account
              </button>
            </div>

            <h2 className="text-lg font-bold font-cyber-mono text-green-400">
              {mode === 'signin' ? 'ACCOUNT SIGN IN' : 'NEW REGISTRATION'}
            </h2>

            {mode === 'register' && (
              <div>
                <label className="relative w-20 h-20 mx-auto rounded-full bg-zinc-800 border-2 border-green-500 overflow-hidden flex items-center justify-center cursor-pointer block hover:border-green-400">
                  {avatarData ? (
                    <img src={avatarData} alt="Avatar" className="w-full h-full object-cover" />
                  ) : (
                    <Icons.Plus className="w-8 h-8 text-green-400" />
                  )}
                  <input type="file" accept="image/*" onChange={handleAvatarChange} className="hidden" />
                </label>
                <p className="text-[11px] text-zinc-400 mt-1 font-cyber-mono">Tap circle to add photo *</p>
              </div>
            )}

            <div className="space-y-3 text-left">
              <input
                type="text"
                placeholder="Username (e.g. Alex)"
                value={username}
                onChange={(e) => setUsername(e.target.value)}
                className="w-full bg-black border border-zinc-700 rounded-lg px-3.5 py-2.5 text-white text-sm font-cyber-mono focus:outline-none focus:border-green-400"
              />
              <input
                type="password"
                placeholder="Password"
                value={password}
                onChange={(e) => setPassword(e.target.value)}
                className="w-full bg-black border border-zinc-700 rounded-lg px-3.5 py-2.5 text-white text-sm font-cyber-mono focus:outline-none focus:border-green-400"
              />
            </div>

            <button
              type="submit"
              className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg font-cyber-mono uppercase text-sm transition"
            >
              {mode === 'signin' ? 'Sign In & Enter' : 'Create Account'}
            </button>

            {errorMsg && <p className="text-xs text-red-400 font-cyber-mono">{errorMsg}</p>}

            {mode === 'signin' && (
              <p className="text-[11px] text-zinc-500 font-cyber-mono">
                Demo Credentials: <b>Alex</b> / <b>password</b> or <b>Maya</b> / <b>password</b>
              </p>
            )}
          </form>
        </div>
      );
    }

    /* --- TOP BAR --- */
    function TopBar({ user, onOpenFriends, onOpenProfile, onOpenSearch }) {
      return (
        <header className="sticky top-0 z-40 flex items-center justify-between gap-4 px-4 py-2.5 bg-white border-b border-gray-200">
          <div className="flex items-center gap-3">
            {/* Requirement 2: 3 lines button opens Friends side bar */}
            <button onClick={onOpenFriends} className="p-2 rounded-full hover:bg-gray-100 text-gray-700 cursor-pointer" title="Friends">
              <Icons.Menu className="w-6 h-6" />
            </button>
            {/* Requirement 1: Profile click opens Account side bar */}
            <button onClick={onOpenProfile} className="flex items-center gap-2 hover:bg-gray-100 rounded-full pr-3 cursor-pointer" title="Account Settings">
              <img src={user.photoURL} alt={user.username} className="w-8 h-8 rounded-full object-cover border border-gray-300" />
              <span className="font-semibold text-gray-900 text-sm">{user.username}</span>
            </button>
            <span className="text-xs font-bold uppercase tracking-widest text-gray-400 pl-2 border-l border-gray-200">
              business
            </span>
          </div>
          <button onClick={onOpenSearch} className="p-2 rounded-full hover:bg-gray-100 text-gray-600 cursor-pointer">
            <Icons.Search className="w-5 h-5" />
          </button>
        </header>
      );
    }

    /* --- 2. FRIENDS SIDEBAR (Requirement 2) --- */
    function FriendsDrawer({ open, onClose, users, messages, currentUser, onSelectFriend }) {
      if (!open) return null;

      // Find all accounts the user has sent or received messages with
      const interactedPeerIds = new Set();
      messages.forEach(m => {
        if (m.senderId === currentUser.uid) interactedPeerIds.add(m.recipientId);
        if (m.recipientId === currentUser.uid) interactedPeerIds.add(m.senderId);
      });

      // Filter interacted users (or show all other users if none yet)
      const friendUsers = users.filter(u => u.uid !== currentUser.uid && interactedPeerIds.has(u.uid));
      const otherUsers = users.filter(u => u.uid !== currentUser.uid && !interactedPeerIds.has(u.uid));

      return (
        <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex">
          <div className="bg-white text-gray-900 w-80 max-w-[85vw] h-full shadow-2xl flex flex-col p-4 border-r border-gray-200 animate-in slide-in-from-left duration-200">
            {/* Header: Friends text on top and cross icon */}
            <div className="flex justify-between items-center pb-3 border-b border-gray-200 mb-4">
              <h2 className="text-xl font-black text-gray-900 tracking-wide">Friends</h2>
              <button onClick={onClose} className="p-2 text-gray-500 hover:text-gray-900 rounded-full hover:bg-gray-100 cursor-pointer">
                <Icons.X className="w-5 h-5" />
              </button>
            </div>

            <div className="flex-1 overflow-y-auto space-y-2">
              {friendUsers.length === 0 && (
                <div className="text-center py-6 px-2 text-xs text-gray-400">
                  No active message threads yet. Pick any user below to start chatting:
                </div>
              )}

              {/* Users you sent/received messages to */}
              {friendUsers.map(peer => {
                const lastMsg = [...messages].reverse().find(
                  m => (m.senderId === currentUser.uid && m.recipientId === peer.uid) ||
                       (m.senderId === peer.uid && m.recipientId === currentUser.uid)
                );
                return (
                  <button
                    key={peer.uid}
                    onClick={() => { onSelectFriend(peer); onClose(); }}
                    className="w-full flex items-center gap-3 p-2.5 rounded-xl hover:bg-blue-50 transition text-left cursor-pointer border border-transparent hover:border-blue-200"
                  >
                    <img src={peer.photoURL} alt={peer.username} className="w-11 h-11 rounded-full object-cover border shrink-0" />
                    <div className="flex-1 min-w-0">
                      <p className="font-bold text-sm text-gray-900 truncate">{peer.username}</p>
                      <p className="text-xs text-gray-500 truncate mt-0.5">
                        {lastMsg ? lastMsg.text || (lastMsg.mediaItems?.length ? `${lastMsg.mediaItems.length} media attached` : 'Media') : 'Tap to chat'}
                      </p>
                    </div>
                  </button>
                );
              })}

              {/* Other users directory */}
              {otherUsers.length > 0 && (
                <div className="pt-4 border-t border-gray-100">
                  <p className="text-[11px] font-bold uppercase tracking-wider text-gray-400 px-2 mb-2">Other Accounts</p>
                  {otherUsers.map(peer => (
                    <button
                      key={peer.uid}
                      onClick={() => { onSelectFriend(peer); onClose(); }}
                      className="w-full flex items-center gap-3 p-2 rounded-xl hover:bg-gray-100 transition text-left cursor-pointer"
                    >
                      <img src={peer.photoURL} alt={peer.username} className="w-9 h-9 rounded-full object-cover border shrink-0" />
                      <p className="font-semibold text-sm text-gray-800 truncate">{peer.username}</p>
                    </button>
                  ))}
                </div>
              )}
            </div>
          </div>
          <div className="flex-1" onClick={onClose} />
        </div>
      );
    }

    /* --- 3. PROFILE SIDEBAR (Requirement 1) --- */
    function ProfileDrawer({ open, onClose, user, onLogOut, onDeleteAccount, onUpdateUser }) {
      const [editing, setEditing] = useState(false);
      const [editName, setEditName] = useState(user.username);
      const [editPhoto, setEditPhoto] = useState(user.photoURL);

      useEffect(() => {
        setEditName(user.username);
        setEditPhoto(user.photoURL);
        setEditing(false);
      }, [open, user]);

      if (!open) return null;

      const handleReset = () => {
        // Reset icon restores initial user info
        setEditName(user.username);
        setEditPhoto(user.photoURL);
        setEditing(false);
      };

      const handleSaveEdit = (e) => {
        e.preventDefault();
        if (!editName.trim()) return;
        onUpdateUser({ ...user, username: editName.trim(), photoURL: editPhoto });
        setEditing(false);
      };

      const handlePhotoChange = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => setEditPhoto(reader.result);
        reader.readAsDataURL(file);
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex justify-end">
          <div className="flex-1" onClick={onClose} />
          <div className="bg-white text-gray-900 w-80 max-w-[85vw] h-full shadow-2xl flex flex-col p-6 animate-in slide-in-from-right duration-200">
            {/* Top Bar with Cross Icon */}
            <div className="flex items-center justify-between pb-4 border-b border-gray-200 mb-6">
              <span className="text-base font-bold text-gray-800">Account Profile</span>
              <button
                type="button"
                onClick={onClose}
                className="p-2 text-gray-600 hover:text-gray-900 rounded-full hover:bg-gray-100 cursor-pointer"
                title="Go Back"
              >
                <Icons.X className="w-5 h-5" />
              </button>
            </div>

            {/* Profile Avatar & Details */}
            <div className="flex flex-col items-center flex-1 space-y-4 text-center">
              {editing ? (
                <label className="relative w-24 h-24 rounded-full border-2 border-dashed border-blue-500 overflow-hidden flex items-center justify-center cursor-pointer group">
                  <img src={editPhoto} alt="Edit avatar" className="w-full h-full object-cover" />
                  <span className="absolute inset-0 bg-black/40 text-white text-[10px] flex items-center justify-center opacity-0 group-hover:opacity-100 transition">Change</span>
                  <input type="file" accept="image/*" onChange={handlePhotoChange} className="hidden" />
                </label>
              ) : (
                <img
                  src={user.photoURL}
                  alt={user.username}
                  className="w-24 h-24 rounded-full object-cover border-4 border-blue-500 shadow-md"
                />
              )}

              {editing ? (
                <input
                  type="text"
                  value={editName}
                  onChange={(e) => setEditName(e.target.value)}
                  className="border rounded-lg px-3 py-1.5 text-sm text-center font-bold focus:outline-none focus:border-blue-500"
                />
              ) : (
                <div>
                  <h3 className="text-xl font-bold text-gray-900">{user.username}</h3>
                  <p className="text-xs text-gray-400 mt-0.5">UID: {user.uid.slice(0, 10)}</p>
                </div>
              )}

              {/* Requirement 1 Action Buttons */}
              <div className="w-full pt-6 space-y-3">
                {editing ? (
                  <button
                    onClick={handleSaveEdit}
                    className="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-bold transition cursor-pointer"
                  >
                    Save Changes
                  </button>
                ) : (
                  <button
                    onClick={() => setEditing(true)}
                    className="w-full py-2.5 px-4 bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 transition cursor-pointer"
                  >
                    <Icons.Pencil className="w-4 h-4" /> Edit Profile
                  </button>
                )}

                {/* Reset Icon Button */}
                <button
                  type="button"
                  onClick={handleReset}
                  title="Reset form"

                >

    /* --- 4. DIRECT CHAT VIEW (Requirement 3: Plus multiple media, 3-dots Block) --- */
    function DirectChatView({ currentUser, recipient, messages, onSendMessage, onToggleBlock, onBack }) {
      const [text, setText] = useState('');
      const [mediaItems, setMediaItems] = useState([]); // Multiple photos/videos
      const [menuOpen, setMenuOpen] = useState(false);
      const endRef = useRef(null);
      const fileInputRef = useRef(null);

      useEffect(() => {
        endRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, mediaItems]);

      // Check blocking logic
      const isBlockedByMe = currentUser.blockedUsers?.includes(recipient.uid);
      const isBlockedByThem = recipient.blockedUsers?.includes(currentUser.uid);

      // Handle selecting multiple photos or videos
      const handleFileChange = (e) => {
        const files = Array.from(e.target.files || []);
        if (files.length === 0) return;

        files.forEach(file => {
          const isVideo = file.type.startsWith('video');
          const reader = new FileReader();
          reader.onload = () => {
            setMediaItems(prev => [...prev, { src: reader.result, isVideo }]);
          };
          reader.readAsDataURL(file);
        });
      };

      const handleRemoveMedia = (index) => {
        setMediaItems(prev => prev.filter((_, i) => i !== index));
      };

      const handleSend = (e) => {
        e.preventDefault();
        if (isBlockedByMe || isBlockedByThem) return;
        if (!text.trim() && mediaItems.length === 0) return;

        onSendMessage({
          senderId: currentUser.uid,
          recipientId: recipient.uid,
          text: text.trim(),
          mediaItems: mediaItems,
          timestamp: new Date().toISOString()
        });

        setText('');
        setMediaItems([]);
        if (fileInputRef.current) fileInputRef.current.value = '';
      };

      const threadMessages = messages.filter(
        m => (m.senderId === currentUser.uid && m.recipientId === recipient.uid) ||
             (m.senderId === recipient.uid && m.recipientId === currentUser.uid)
      );

      return (
        <div className="h-[calc(100vh-60px)] flex flex-col bg-gray-100 max-w-2xl mx-auto border-x border-gray-200 bg-white">
          {/* Top Bar with 3-Dots */}
          <div className="flex items-center justify-between p-3 border-b bg-white relative">
            <div className="flex items-center gap-3">
              <button onClick={onBack} className="p-2 hover:bg-gray-100 rounded-full cursor-pointer"><Icons.ArrowLeft className="w-5 h-5 text-gray-700" /></button>
              <img src={recipient.photoURL} alt={recipient.username} className="w-9 h-9 rounded-full object-cover border" />
              <h3 className="font-bold text-gray-900">{recipient.username}</h3>
            </div>

            {/* Requirement 3: 3 dots menu in the top right corner */}
            <div className="relative">
              <button
                type="button"
                onClick={() => setMenuOpen(!menuOpen)}
                className="p-2 text-gray-600 hover:text-gray-900 rounded-full hover:bg-gray-100 cursor-pointer"
                title="Options"
              >
                <Icons.MoreVertical className="w-5 h-5" />
              </button>

              {menuOpen && (
                <div className="absolute right-0 top-11 bg-white border border-gray-200 shadow-xl rounded-xl py-1 w-32 z-50">
                  <button
                    type="button"
                    onClick={() => {
                      setMenuOpen(false);
                      onToggleBlock(recipient.uid);
                    }}
                    className={`w-full text-left px-4 py-2.5 text-sm font-bold cursor-pointer transition ${
                      isBlockedByMe ? 'text-blue-600 hover:bg-blue-50' : 'text-red-600 hover:bg-red-50'
                    }`}
                  >
                    {isBlockedByMe ? 'Unblock' : 'Block'}
                  </button>
                </div>
              )}
            </div>
          </div>

          {/* Messages list */}
          <div className="flex-1 p-4 space-y-3 overflow-y-auto bg-gray-50">
            {threadMessages.length === 0 ? (
              <p className="text-center text-xs text-gray-400 mt-10">Start your conversation with {recipient.username}!</p>
            ) : (
              threadMessages.map((m, idx) => {
                const isMe = m.senderId === currentUser.uid;
                return (
                  <div key={idx} className={`flex ${isMe ? 'justify-end' : 'justify-start'}`}>
                    <div className={`max-w-[78%] px-4 py-2.5 rounded-2xl text-sm shadow-xs ${isMe ? 'bg-blue-600 text-white rounded-br-none' : 'bg-white border text-gray-800 rounded-bl-none'}`}>
                      {/* Attached media display */}
                      {m.mediaItems && m.mediaItems.length > 0 && (
                        <div className="grid grid-cols-2 gap-1.5 mb-2">
                          {m.mediaItems.map((item, mIdx) => (
                            item.isVideo ? (
                              <video key={mIdx} src={item.src} controls className="w-full h-28 rounded-lg object-cover bg-black col-span-2" />
                            ) : (
                              <img key={mIdx} src={item.src} alt="Attachment" className="w-full h-28 object-cover rounded-lg border" />
                            )
                          ))}
                        </div>
                      )}
                      {m.text && <p className="whitespace-pre-wrap">{m.text}</p>}
                    </div>
                  </div>
                );
              })
            )}
            <div ref={endRef} />
          </div>

          {/* Staged media preview tray */}
          {mediaItems.length > 0 && (
            <div className="p-2.5 bg-gray-100 border-t flex gap-2 overflow-x-auto">
              {mediaItems.map((item, i) => (
                <div key={i} className="relative w-16 h-16 rounded-lg overflow-hidden border border-gray-300 bg-white shrink-0">
                  {item.isVideo ? (
                    <video src={item.src} className="w-full h-full object-cover" />
                  ) : (
                    <img src={item.src} className="w-full h-full object-cover" />
                  )}
                  <button
                    type="button"
                    onClick={() => handleRemoveMedia(i)}
                    className="absolute top-0.5 right-0.5 w-5 h-5 bg-black/70 text-white rounded-full flex items-center justify-center hover:bg-red-600"
                  >
                    <Icons.X className="w-3 h-3" />
                  </button>
                </div>
              ))}
            </div>
          )}

          {/* Requirement 3: Conditional Textbox Area */}
          {isBlockedByThem ? (
            /* The user getting blocked sees "You're Blocked" in the text box place */
            <div className="p-4 bg-gray-100 text-center text-sm font-bold text-red-600 border-t tracking-wide select-none">
              You're Blocked
            </div>
          ) : isBlockedByMe ? (
            /* Only who blocked can unblock him */
            <div className="p-3 bg-gray-100 flex items-center justify-between border-t px-5">
              <span className="text-xs text-gray-600 font-medium">You have blocked this user.</span>
              <button
                type="button"
                onClick={() => onToggleBlock(recipient.uid)}
                className="text-blue-600 hover:underline font-bold text-sm cursor-pointer"
              >
                Unblock
              </button>
            </div>
          ) : (
            /* Normal Chat Form with Plus Icon */
            <form onSubmit={handleSend} className="p-3 border-t bg-white flex items-center gap-2">
              <label className="p-2 text-gray-500 hover:text-blue-600 rounded-full hover:bg-gray-100 cursor-pointer" title="Add multiple photos or videos">
                <Icons.Plus className="w-6 h-6" />
                <input
                  ref={fileInputRef}
                  type="file"
                  multiple
                  accept="image/*,video/*"
                  onChange={handleFileChange}
                  className="hidden"
                />
              </label>

              <input
                type="text"
                placeholder="Type a message..."
                value={text}
                onChange={e => setText(e.target.value)}
                className="flex-1 bg-gray-100 border rounded-full px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500 text-gray-900"
              />

              <button
                type="submit"
                className="w-10 h-10 rounded-full bg-blue-600 hover:bg-blue-700 text-white flex items-center justify-center shrink-0 transition"
              >
                <Icons.Send className="w-4 h-4 ml-0.5" />
              </button>
            </form>
          )}
        </div>
      );
    }

    /* --- CREATE PRODUCT MODAL --- */
    function CreateProductModal({ open, onClose, onSave }) {
      const [name, setName] = useState('');
      const [price, setPrice] = useState('');
      const [currency, setCurrency] = useState('$ USD');
      const [description, setDescription] = useState('');
      const [photoURL, setPhotoURL] = useState('');

      if (!open) return null;

      const handlePhoto = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => setPhotoURL(reader.result);
        reader.readAsDataURL(file);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name || !price || !photoURL) return;
        onSave({ name, price, currency, description, photoURL });
        setName(''); setPrice(''); setDescription(''); setPhotoURL('');
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
          <form onSubmit={handleSubmit} className="bg-white rounded-xl p-6 w-full max-w-md shadow-2xl space-y-4">
            <div className="flex justify-between items-center border-b pb-2">
              <h2 className="text-lg font-bold text-gray-900">Create Product</h2>
              <button type="button" onClick={onClose} className="cursor-pointer"><Icons.X className="w-5 h-5 text-gray-500" /></button>
            </div>
            <input
              type="text"
              placeholder="Product Name (2-8 chars)"
              maxLength={8}
              value={name}
              onChange={e => setName(e.target.value)}
              required
              className="w-full border rounded-lg p-2.5 text-sm"
            />
            <div className="flex gap-2">
              <select value={currency} onChange={e => setCurrency(e.target.value)} className
